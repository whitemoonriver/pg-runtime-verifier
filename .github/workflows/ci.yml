name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node ./bin/pg-runtime-verifier.js --help

  package-smoke:
    name: Package smoke (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Require normalized package metadata
        shell: bash
        run: |
          npm pkg fix
          git diff --exit-code -- package.json

      - name: Inspect packed file set
        shell: bash
        run: |
          npm pack --dry-run --json > pack-dry-run.json
          node -e "const fs=require('node:fs'); const report=JSON.parse(fs.readFileSync('pack-dry-run.json','utf8'))[0]; const files=report.files.map((entry)=>entry.path); const required=['package.json','README.md','LICENSE','bin/pg-runtime-verifier.js','src/index.js']; for(const file of required){if(!files.includes(file)){console.error('missing packed file:',file);process.exit(1);}} const forbidden=['.github/','examples/','test/','artifacts/']; for(const prefix of forbidden){if(files.some((file)=>file.startsWith(prefix))){console.error('unexpected packed path:',prefix);process.exit(1);}} console.log(files);"

      - name: Install and invoke packed CLI as a consumer
        shell: bash
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > pack.json
          archive=$(node -e "const fs=require('node:fs'); const report=JSON.parse(fs.readFileSync('pack.json','utf8'))[0]; process.stdout.write(report.filename);")
          consumer=$(mktemp -d)
          cd "$consumer"
          npm init -y >/dev/null
          npm install --save-dev "$RUNNER_TEMP/$archive"
          npx pg-runtime-verifier --help
          npm exec -- pg-runtime-verifier --version

  postgres-integration:
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Run synthetic verification
        run: >-
          node ./bin/pg-runtime-verifier.js run
          --config ./examples/basic/pg-runtime-verifier.config.json
          --output ./artifacts/example-verification.json

      - name: Assert PASS evidence
        run: >-
          node -e "const fs=require('node:fs');
          const e=JSON.parse(fs.readFileSync('./artifacts/example-verification.json','utf8'));
          if(e.status!=='PASS'||e.summary.failed!==0) process.exit(1);
          console.log(e.database.serverVersion, e.summary);"

      - name: Assert expected FAIL semantics
        shell: bash
        run: |
          set +e
          node ./bin/pg-runtime-verifier.js run \
            --config ./examples/basic/expected-failure.config.json \
            --skip-migration \
            --output ./artifacts/expected-failure.json
          code=$?
          set -e
          test "$code" -eq 1
          node -e "const fs=require('node:fs'); const e=JSON.parse(fs.readFileSync('./artifacts/expected-failure.json','utf8')); if(e.status!=='FAIL'||e.summary.failed<1) process.exit(1); console.log(e.summary);"

      - name: Assert ERROR evidence redaction
        shell: bash
        env:
          BROKEN_DATABASE_URL: postgresql://alice:super-secret@127.0.0.1:1/postgres
        run: |
          set +e
          node ./bin/pg-runtime-verifier.js run \
            --config ./examples/basic/expected-error.config.json \
            --skip-migration \
            --output ./artifacts/expected-error.json
          code=$?
          set -e
          test "$code" -eq 2
          node -e "const fs=require('node:fs'); const raw=fs.readFileSync('./artifacts/expected-error.json','utf8'); if(raw.includes('super-secret')||raw.includes('postgresql://alice:')) process.exit(1); const e=JSON.parse(raw); if(e.status!=='ERROR') process.exit(1); console.log(e.status);"

      - uses: actions/upload-artifact@v6
        with:
          name: pg-runtime-verifier-evidence-pg${{ matrix.postgres }}
          path: artifacts/*.json
