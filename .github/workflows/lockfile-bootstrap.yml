name: Lockfile Bootstrap

on:
  push:
    branches:
      - harden/reproducible-install

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit package-lock for bootstrap
        shell: bash
        run: |
          echo '---PACKAGE-LOCK-BASE64-BEGIN---'
          base64 -w 0 package-lock.json
          echo
          echo '---PACKAGE-LOCK-BASE64-END---'
